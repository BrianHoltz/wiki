<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ontology hierarchy</title>
<style>
:root{color-scheme:light dark;--bg:#fff;--fg:#202124;--muted:#5f6368;--panel:#f5f7fa;--line:#c7cbd1;--accent:#1769aa}
@media(prefers-color-scheme:dark){:root{--bg:#17191c;--fg:#e8eaed;--muted:#b4bac4;--panel:#24282e;--line:#59616d;--accent:#8ab4f8}}
body{background:var(--bg);color:var(--fg);font:15px/1.45 system-ui,sans-serif;margin:0}
main{max-width:1100px;margin:auto;padding:24px}h1{margin:0 0 4px}h2{margin-top:28px}
.muted{color:var(--muted)}.notice{background:var(--panel);border-left:4px solid var(--accent);padding:12px 16px}
.controls{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}
input,button{background:var(--bg);border:1px solid var(--line);border-radius:5px;color:var(--fg);padding:8px 10px}
input{min-width:280px;flex:1}button{cursor:pointer}ul{list-style:none;margin:0;padding-left:22px}li{margin:3px 0}
summary{cursor:pointer;display:flex;align-items:baseline;gap:4px;list-style:none}summary::-webkit-details-marker{display:none}summary::before{content:"\25B6";display:inline-block;flex:none;width:1em}details[open] > summary::before{content:"\25BC"}.meta{color:var(--muted);font-size:12px;margin-left:6px;flex:none}.definition{color:var(--muted);font-size:13px;margin-left:8px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:bottom}details[open] > summary .definition{overflow:visible;text-overflow:clip;white-space:normal;vertical-align:baseline}.alt,.reverse{font-size:13px;margin:6px 0 8px 22px}.alt,.reverse{color:var(--muted)}
details.lineage > summary::before{content:"\25C6"}
a{color:var(--accent)}#results{margin:10px 0 18px}.result{padding:5px 0;border-bottom:1px solid var(--line)}
.node{display:flex;align-items:baseline;gap:4px}.expander,.lineage-toggle{background:transparent;border:0;color:var(--fg);cursor:pointer;font:inherit;padding:0;width:1em}.lineage-toggle{color:var(--accent)}.children[hidden]{display:none}
</style>
</head>
<body>
<main>
<h1>Ontology hierarchy</h1>
<p class="muted">A browseable single-parent rendering of the
the project canonical upper ontology with the physical branch retained from the
<a href="https://www.ontology4.us/download/dot/SumoOntology.pdf">Ontology4 SUMO PDF graph</a>.
Definitions identify project editorial content and retained SUMO content.</p>
<div class="controls"><input id="search" type="search" placeholder="Search SUMO concepts">
<button id="expand">Expand all</button><button id="collapse">Collapse all</button></div>
<div id="summary" class="muted"></div><div id="results"></div><section id="tree"></section>
</main>
<script>
const esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let data,byId,alternateChildren,descendantCounts,parentOf,nodeModes,lineageNode,lineageChildren;
function descendantCount(id){if(descendantCounts.has(id))return descendantCounts.get(id);const n=byId.get(id);const count=n.children.reduce((total,child)=>total+1+descendantCount(child),0);descendantCounts.set(id,count);return count}
function link(id){const n=byId.get(id);return n?`<a href="#${encodeURIComponent(id)}" data-node="${esc(id)}">${esc(n.label)}</a>`:esc(id)}
function formatDefinition(text){return esc(text).replace(/&amp;%([A-Za-z0-9_]+)/g,(_,id)=>byId.has(id)?link(id):esc(id))}
function renderNode(id,open=false,children=null,lineage=false,childOpen=null){const n=byId.get(id);const visibleChildren=children||lineageChildren?.get(id)||n.children;
const directChildren=n.children.length;
const otherDescendants=descendantCount(id)-directChildren;
const marker=open?'▼':'▶';
const childCount=directChildren?`<span class="meta"> · ${directChildren}${otherDescendants?`+${otherDescendants}`:''}</span>`:'';
const altCount=n.alternateParents.length?`<span class="meta"> · ${n.alternateParents.length} &#8593;</span>`:'';
const provisional=n.provisionalParent?` <span class="meta">· provisional placement</span>`:'';
const shortDef=n.definition?`<span class="definition" title="${esc(n.definition)}">${formatDefinition(n.definition)}</span>`:'';
const text=`<span class="node-title">${esc(n.label)}</span><button class="lineage-toggle" type="button" data-node="${esc(id)}">↖</button>${childCount}${altCount}${provisional}${shortDef}`;
const alts=!lineageNode&&n.alternateParents.length?`<div class="alt"><strong>Alternate Parents:</strong> ${n.alternateParents.map(link).join(', ')}</div>`:'';
const reverse=alternateChildren.get(id)||[];
const reverseBlock=!lineageNode&&reverse.length?`<div class="reverse"><strong>Alternate Children:</strong> ${reverse.map(link).join(', ')}</div>`:'';
return `<li id="${encodeURIComponent(id)}"><div class="node"><button class="expander" type="button" data-node="${esc(id)}">${marker}</button><span class="node-content">${text}</span></div>${alts}${reverseBlock}<ul class="children"${open?'':' hidden'}>${visibleChildren.map(child=>renderNode(child,childOpen===null?(lineageChildren?.has(child)||nodeModes.get(child)===1):childOpen)).join('')}</ul></li>`}
function renderLineage(path){lineageChildren=new Map(path.map((id,index)=>[id,index===path.length-1?byId.get(id).children:[path[index+1]]]));return renderNode(path[0],true)}
function render(){let tree;
if(lineageNode){const path=[],seen=new Set();for(let id=lineageNode;id&&!seen.has(id);id=parentOf.get(id)){path.unshift(id);seen.add(id)}tree=`<ul>${renderLineage(path)}</ul>`}
else {lineageChildren=null;tree=data.rootNodes.map(root=>`<ul>${renderNode(root,nodeModes.get(root)===1)}</ul>`).join('')}
document.querySelector('#tree').innerHTML=tree;
const stats=data.stats||{}, count=(key,fallback=0)=>Number.isFinite(stats[key])?stats[key]:fallback;
document.querySelector('#summary').textContent=`${count('nodeCount',data.nodes.length).toLocaleString()} concepts · ${count('definitionCount',data.nodes.filter(n=>n.definition).length).toLocaleString()} definitions · ${count('projectedEdgeCount').toLocaleString()} primary edges · ${count('multipleParentNodeCount').toLocaleString()} alternate-parent cases · ${count('unaryNodeCount').toLocaleString()} unary nodes`;
}
document.querySelector('#expand').onclick=()=>{lineageNode=null;data.nodes.forEach(n=>nodeModes.set(n.id,1));render()};
document.querySelector('#collapse').onclick=()=>{lineageNode=null;data.nodes.forEach(n=>nodeModes.set(n.id,0));render()};
function focusNode(id){nodeModes.set(id,1);lineageNode=null;render();document.getElementById(encodeURIComponent(id))?.scrollIntoView({block:'center'})}
document.querySelector('#tree').onclick=e=>{const a=e.target.closest('a[data-node]');if(a){e.preventDefault();focusNode(a.dataset.node);return}const lineageButton=e.target.closest('button.lineage-toggle[data-node]');if(lineageButton){const id=lineageButton.dataset.node;lineageNode=lineageNode===id?null:id;render();return}const button=e.target.closest('button.expander[data-node]');if(!button)return;const id=button.dataset.node;nodeModes.set(id,nodeModes.get(id)===1?0:1);lineageNode=null;render()};
document.querySelector('#results').onclick=e=>{const a=e.target.closest('a[data-node]');if(!a)return;e.preventDefault();focusNode(a.dataset.node)};
document.querySelector('#search').oninput=e=>{const q=e.target.value.trim().toLowerCase();
const hits=data.nodes.filter(n=>`${n.id} ${n.label}`.toLowerCase().includes(q)).slice(0,100);
document.querySelector('#results').innerHTML=q?`<strong>${hits.length}${hits.length===100?'+':''} matches</strong>`+
hits.map(n=>`<div class="result">${link(n.id)} <span class="meta">${esc(n.id)}</span></div>`).join(''):''};
fetch('sumo.json').then(r=>r.json()).then(x=>{data=x;byId=new Map(data.nodes.map(n=>[n.id,n]));parentOf=new Map();data.nodes.forEach(n=>n.children.forEach(child=>parentOf.set(child,n.id)));descendantCounts=new Map();data.nodes.forEach(n=>descendantCount(n.id));nodeModes=new Map(data.nodes.map(n=>[n.id,0]));data.rootNodes.forEach(root=>nodeModes.set(root,1));lineageNode=null;alternateChildren=new Map();data.nodes.forEach(n=>n.alternateParents.forEach(parent=>{if(!alternateChildren.has(parent))alternateChildren.set(parent,[]);alternateChildren.get(parent).push(n.id)}));render()})
.catch(e=>document.querySelector('#tree').textContent=`Could not load sumo.json: ${e}`);
</script>
</body>
</html>
