<style>

<script>
const esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let data,byId,descendantCounts,parentOf,nodeModes,lineageNode,lineageChildren,lineageModes,savedView,lastTitleNode;
function descendantCount(id){if(descendantCounts.has(id))return descendantCounts.get(id);const n=byId.get(id);const count=n.children.reduce((total,child)=>total+1+descendantCount(child),0);descendantCounts.set(id,count);return count}
function displayLabel(n){if(/^Roget's Thesaurus/i.test(data?.source?.name||''))return n.label.toLowerCase().replace(/\b[\wÀ-ÿ][\wÀ-ÿ'’-]*/g,w=>w.charAt(0).toUpperCase()+w.slice(1));return n.label}
function displayDefinition(n){if(!n.definition)return '';if(/^Roget's Thesaurus/i.test(data?.source?.name||'')&&(/^WORDS EXPRESSING\b/i.test(n.definition)||n.definition.endsWith(` / ${n.label}`)))return '';return n.definition}
function link(id){const n=byId.get(id);return n?`<a href="#${encodeURIComponent(id)}" data-node="${esc(id)}">${esc(displayLabel(n))}</a>`:esc(id)}
function sourceLink(n){return n.sourceUrl?` <a class="source-link" href="${esc(n.sourceUrl)}" target="_blank" rel="noopener" aria-label="Open source for ${esc(n.label)}">↗</a>`:''}
function formatDefinition(text){return esc(text).replace(/&amp;%([A-Za-z0-9_]+)/g,(_,id)=>byId.has(id)?link(id):esc(id))}
function formatSpeciesCount(count){if(count===null||count===undefined)return '';if(count<1000)return String(count);const rounded=Number(count.toPrecision(3));const unit=rounded>=1e6?1e6:1e3;return (rounded/unit).toPrecision(3)+(unit===1e6?'M':'K')}
function speciesStats(n){const s=n.speciesCount;if(!s)return '';const known=v=>v!==null&&v!==undefined;const parts=[];if(known(s.extinct))parts.push(`${formatSpeciesCount(s.extinct)}☠︎`);if(known(s.extant))parts.push(`${formatSpeciesCount(s.extant)}♥︎`);const count=parts.length?parts.join('+'):(known(s.total)?formatSpeciesCount(s.total):'');return count?`<a class="species-count" href="${esc(s.url)}" target="_blank" rel="noopener">${count}</a>`:''}
// Entity counts: scoped populations, catalogue totals and cardinalities.
function formatEntityCount(s){
const parts=[];
if(s.extinctDisplay)parts.push(`${s.extinctDisplay}☠︎`);
if(s.extantDisplay)parts.push(`${s.extantDisplay}♥︎`);
return parts.length?parts.join('+')+(s.countLabel?` ${s.countLabel}`:''):s.display;
}
function entityStats(n){return (n.entityCounts||[]).map(s=>{
const title=[s.scope,s.interpretation,s.retrieved?`Sources checked ${s.retrieved}`:''].filter(Boolean).join(' ');
return `<a class="entity-count" href="${esc(s.url)}" title="${esc(title)}" aria-label="${esc(`${n.label}: ${formatEntityCount(s)}. ${title}`)}" target="_blank" rel="noopener">${esc(formatEntityCount(s))}</a>`;
}).join(' · ')}
// End entity counts.
function renderNode(id,open=false,children=null,lineage=false,childOpen=null){const n=byId.get(id);const visibleChildren=children||lineageChildren?.get(id)||n.children;
const directChildren=n.children.length;
const otherDescendants=descendantCount(id)-directChildren;
const marker=open?'▼':'▶';
const species=[speciesStats(n),entityStats(n)].filter(Boolean).join(' · ');const childrenStats=directChildren?`${directChildren}${otherDescendants?`+${otherDescendants}`:''}&#8595;`:'';
const childCount=childrenStats||species?`<span class="meta node-stats">${childrenStats}${childrenStats&&species?' ':''}${species}</span>`:'';

const definition=displayDefinition(n).trim();const shortDef=definition?`<span class="definition${open?' expanded':''}" title="${esc(definition)}">&nbsp;${formatDefinition(definition)}</span>`:'';
const expander=directChildren?`<button class="expander" type="button" data-node="${esc(id)}">${marker}</button>`:'<span class="expander-placeholder" aria-hidden="true">○</span>';
const text=`<span class="node-title">${link(id)}${sourceLink(n)}</span>${childCount}${provisional}${shortDef}`;
return `<li id="${encodeURIComponent(id)}"><div class="node">${expander}<span class="node-content">${text}</span></div><ul class="children"${open?'':' hidden'}>${visibleChildren.map(child=>renderNode(child,(lineageNode?lineageModes:nodeModes).get(child)===1)).join('')}</ul></li>`}
function renderLineage(path){lineageChildren=new Map(path.map((id,index)=>[id,index===path.length-1?byId.get(id).children:[path[index+1]]]));return renderNode(path[0],lineageModes.get(path[0])===1)}
function render(){let tree;
if(lineageNode){const path=[],seen=new Set();for(let id=lineageNode;id&&!seen.has(id);id=parentOf.get(id)){path.unshift(id);seen.add(id)}tree=`<ul>${renderLineage(path)}</ul>`}

const sourceUrl=source.url||'v1010/Ontology.md';
const sourceText=`<a href="${esc(sourceUrl)}" target="_blank" rel="noopener">${esc(sourceLabel)}</a>`;
document.querySelector('#summary').innerHTML=`... v1010 · all ${count('nodeCount',data.nodes.length).toLocaleString()} concepts · ${count('definitionCount',data.nodes.filter(n=>n.definition).length).toLocaleString()} definitions · ${count('projectedEdgeCount').toLocaleString()} edges in ${sourceText}`;
}

document.querySelector('#collapse').onclick=()=>{clearLineage();data.nodes.forEach(n=>nodeModes.set(n.id,0));render()};

function focusLineage(id){savedView=snapshotView();lastTitleNode=null;lineageNode=id;lineageModes=new Map(data.nodes.map(n=>[n.id,0]));for(let current=id;current;current=parentOf.get(current))lineageModes.set(current,1);render();document.getElementById(encodeURIComponent(id))?.scrollIntoView({block:'center'})}
document.querySelector('#tree').onclick=e=>{
const a=e.target.closest('a[data-node]');
if(a){e.preventDefault();const id=a.dataset.node;

const button=e.target.closest('button.expander[data-node]');if(!button)return;
const id=button.dataset.node,modes=lineageNode?lineageModes:nodeModes;
modes.set(id,modes.get(id)===1?0:1);lastTitleNode=null;render()};
document.querySelector('#results').onclick=e=>{const a=e.target.closest('a[data-node]');if(!a)return;e.preventDefault();focusLineage(a.dataset.node)};
function searchFor(q){q=q.trim().toLowerCase();
const hits=data.nodes.filter(n=>`${n.id} ${n.label}`.toLowerCase().includes(q)).slice(0,100);
document.querySelector('#results').innerHTML=q?`<strong>${hits.length}${hits.length===100?'+':''} matches</strong>`+
hits.map(n=>`<div class="result">${link(n.id)} <span class="meta">${esc(n.id)}</span></div>`).join(''):''};
document.querySelector('#search').oninput=e=>searchFor(e.target.value);
document.querySelector('.search-presets').onclick=e=>{const button=e.target.closest('button[data-target]');if(!button)return;document.querySelector('#search').value=button.dataset.search;document.querySelector('#results').innerHTML='';focusLineage(button.dataset.target)};
function normalizeTree(){const byId=new Map(data.nodes.map(n=>[n.id,n]));const expand=id=>{const n=byId.get(id);return n&&!String(n.label||'').trim()?n.children.flatMap(expand):[id]};data.nodes.forEach(n=>{n.children=n.children.flatMap(expand)});data.rootNodes=data.rootNodes.flatMap(expand);data.nodes=data.nodes.filter(n=>String(n.label||'').trim());const childIds=new Set(data.nodes.flatMap(n=>n.children));data.rootNodes=data.nodes.filter(n=>!childIds.has(n.id)).map(n=>n.id)}

Audio","definition":"A representation or recording of sound.","definitionSource":"project editorial","children":[],"alternateParents":[],"directParentCount":1,"provisionalParent":null},{"id":"Automaton","label":"Automaton","definition":"An abstract machine that changes state while processing input.","definitionSource":"project editorial","children":[],"alternateParents":[],"directParentCount":1,"provisionalParent":null},{"id":"Bacterium","label":"Bacterium","definition":"A small, typically one_celled, prokaryotic &%Microorganism.","definitionSource":"source KIF","children":[],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"Battle","label":"Battle","definition":"A &%ViolentContest between two or more military units within the context of a war. Note that this does not cover the metaphorical sense of 'battle', which simply means a struggle of some sort. This sense should be represented with the more general concept of &%Contest.","definitionSource":"source KIF","children":[],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"Belief","label":"Belief","definition":"A proposition or representation accepted by an agent.","definitionSource":"project editorial","children":[],"alternateParents":[],"directParentCount":1,"provisionalParent":null},{"id":"bet","label":"bet","definition":null,"definitionSource":null,"children":[],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"Beverage","label":"Beverage","definition":"Any food that is ; ingested by &%Drinking. ;Note that this class is disjoint &%Meat and ; &%FruitOrVegetable.","definitionSource":"source KIF","children":[],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"BiologicalObject","label":"Biological object","definition":"An item constituted by or originating from biological activity.","definitionSource":"project editorial","children":[],"alternateParents":[],"directParentCount":1},{"id":"BiologicalProcess","label":"Biological Process","definition":"A &%Process embodied in an &%Organism.","definitionSource":"source KIF","children":["PathologicProcess","PhysiologicProcess","PsychologicalProcess"],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"BiologicallyActiveSubstance","label":"Biologically Active Substance","definition":"A &%Substance that is capable of inducing a change in the structure or functioning of an &%Organism. This &%Class includes &%Substances used in the treatment, diagnosis, prevention or analysis of normal and abnormal body function. This &%Class also includes &%Substances that occur naturally in the body and are administered therapeutically. Finally, &%BiologicallyActiveSubstance includes &%Nutrients, most drugs of abuse, and agents that require special handling because of their toxicity.","definitionSource":"source KIF","children":["Hormone","Nutrient"],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"Bird","label":"Bird","definition":"A &%Vertebrate having a constant body temperature and characterized by the presence of feathers.","definitionSource":"source KIF","children":[],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"Birth","label":"Birth","definition":"The &%Process of being born.","definitionSource":"source KIF","children":[],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"Blood","label":"Blood","definition":"A fluid present in &%Animals that transports &%Nutrients to and waste products away from various &%BodyParts.","definitionSource":"source KIF","children":[],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"BodyCovering","label":"Body Covering","definition":"Any &%BodyPart which is a covering of another &%BodyPart or of an entire &%Organism. This would include the rinds of &%FruitOrVegetables and the skins of &%Animals.","definitionSource":"source KIF","children":[],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"BodyJunction","label":"Body Junction","definition":"The place where two &%BodyParts meet or connect.","definitionSource":"source KIF","children":[],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"BodyMotion","label":"Body Motion","definition":"Any &%Motion where the &%agent is an &%Organism and the &%patient is a &%BodyPart.","definitionSource":"source KIF","children":["dance","swim","walk"],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"BodyPart","label":"Body Part","definition":"A collection of &%Cells and &%Tissues which are localized to a specific area of an &%Organism and which are not pathological. The instances of this &%Class range from gross structures to small components of complex &%Organs.","definitionSource":"source KIF","children":["BodyCovering","BodyJunction","BodyVessel","Cell","Organ"],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"BodySubstance","label":"Body Substance","definition":"Extracellular material and mixtures of cells and extracellular material that are produced, excreted or accreted by an &%Organism. Included here are &%Substances such as saliva, dental enamel, sweat, hormones, and gastric acid.","definitionSource":"source KIF","children":["Blood","Tissue"],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"BodyVessel","label":"Body Vessel","definition":"Any tube-like structure which occurs naturally in an &%Organism and through which a &%BodySubstance can circulate.","definitionSource":"source KIF","children":[],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"Boiling","label":"Boiling","definition":"The &%Class of &%Processes where a &%Substance is heated and converted from a &%Liquid to a &%Gas.","definitionSource":"source KIF","children":[],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"Bone","label":"Bone","definition":"Parts of the body that are made up of &%BoneTissue.","definitionSource":"source KIF","children":[],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"Book","label":"Book","definition":"A &%Document that has pages and is bound.","definitionSource":"source KIF","children":[],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"borrow","label":"borrow","definition":null,"definitionSource":null,"children":[],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"breath","label":"breath","definition":null,"definitionSource":null,"children":[],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"Building","label":"Building","definition":"The Class of &%StationaryArtifacts which are intended to house &%Humans and their activities.","definitionSource":"source KIF","children":[],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"buy","label":"buy","definition":null,"definitionSource":null,"children":[],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"calculate","label":"calculate","definition":null,"definitionSource":null,"children":[],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"Canine","label":"Canine","definition":"The &%Class of &%Carnivores with completely separable toes, nonretractable claws, and long muzzles.","definitionSource":"source KIF","children":[],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"Capability","label":"Capability","definition":"A property representing what an entity can do or undergo.","definitionSource":"project editorial","children":[],"alternateParents":[],"directParentCount":1,"provisionalParent":null},{"id":"Carbohydrate","label":"Carbohydrate","definition":"A compound of living cells and a source of energy for &%Animals. This class includes both simple &%Carbohydrates, i.e. sugars, and complex &%Carbohydrates, i.e. starches.","definitionSource":"source KIF","children":[],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"Carnivore","label":"Carnivore","definition":"The &%DietaryAttribute of flesh-eating &%Organisms. Members with this &%DietaryAttribute typically have four or five claws on each paw. Includes cats, dogs, bears, racoons, and skunks.","definitionSource":"source KIF","children":["Canine","Feline"],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"CausalRelation","label":"Causal relation","definition":"A relation in which one entity contributes to an effect.","definitionSource":"project editorial","children":[],"alternateParents":[],"directParentCount":1,"provisionalParent":null},{"id":"Cell","label":"Cell","definition":"The fundamental structural and functional unit of living &%Organisms.","definitionSource":"source KIF","children":[],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"Certiﬁcate","label":"Certiﬁcate","definition":null,"definitionSource":null,"children":["Patent"],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"ChangeOfPossession","label":"Change Of Possession","definition":"The &%Class of &%Processes where ownership of something is transferred from one &%AutonomousAgent to another.","definitionSource":"source KIF","children":["Getting","Giving"],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"Character","label":"Character","definition":"An element of an alphabet, a set of numerals, etc. Note that a &%Character may or may not be part of a &%Language. &%Character is a subclass of &%SymbolicString, because every instance of &%Character is an alphanumeric sequence consisting of a single element.","definitionSource":"source KIF","children":[],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"ChemicalDecomposition","label":"Chemical Decomposition","definition":"The &%Class of &%ChemicalProcesses in which a &%CompoundSubstance breaks down into simpler products.","definitionSource":"source KIF","children":["combust"],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"ChemicalProcess","label":"Chemical Process","definition":"A &%ChemicalProcess occurs whenever chemical compounds (&%CompoundSubstances) are formed or decomposed. For example, reactants disappear as chemical change occurs, and products appear as chemical change occurs. In a chemical change a chemical reaction takes place. Catalysts in a &%ChemicalProcess may speed up the reaction, but aren't themselves produced or consumed. Examples: rusting of iron and the decomposition of water, induced by an electric current, to gaseous hydrogen and gaseous oxygen.","definitionSource":"source KIF","children":["ChemicalSynthesis"],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"ChemicalSynthesis","label":"Chemical Synthesis","definition":"The &%Class of &%ChemicalProcesses in which a &%CompoundSubstance is formed from simpler reactants.","definitionSource":"source KIF","children":[],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"Circle","label":"Circle","definition":"A plane curve whose points are equidistant from a center.","definitionSource":"project editorial","children":[],"alternateParents":[],"directParentCount":1,"provisionalParent":null},{"id":"Classification","label":"Classification","definition":"A representation that assigns entities to categories.","definitionSource":"project editorial","children":[],"alternateParents":[],"directParentCount":1,"provisionalParent":null},{"id":"ClassificationRelation","label":"Classification relation","definition":"A relation that assigns an entity to a kind or category.","definitionSource":"project editorial","children":[],"alternateParents":[],"directParentCount":1,"provisionalParent":null},{"id":"classify","label":"classify","definition":null,"definitionSource":null,"children":[],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"Clothing","label":"Clothing","definition":"&%Artifact made out of fabrics and possibly other materials that are used to cover the bodies of &%Humans.","definitionSource":"source KIF","children":[],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"Club","label":"Club","definition":"An organization formed around shared membership or activity.","definitionSource":"project editorial","children":[],"alternateParents":[],"directParentCount":1,"provisionalParent":null},{"id":"CognitiveAgent","label":"Cognitive Agent","definition":"A &%CognitiveAgent is an &%AutonomousAgent that has the ability to reason, deliberate, make plans, and experience emotions. Although &%Human is a subclass of &%CognitiveAgent, there may be instances of &%CognitiveAgent which are not also instances of &%Human. For example, &%Primates, dolphins, whales, and some extraterrestrials (if they exist) might be considered &%CognitiveAgents.","definitionSource":"source KIF","children":["OrganizationUnit"],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"ColdBloodedVertebrate","label":"Cold Blooded Vertebrate","definition":"&%Vertebrates whose body temperature is not internally regulated.","definitionSource":"source KIF","children":["Amphibian","Fish","Reptile"],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"Collection","label":"Collection","definition":"An object constituted by multiple members.","definitionSource":"project editorial","children":[],"alternateParents":[],"directParentCount":1,"provisionalParent":null},{"id":"Coloring","label":"Coloring","definition":"The &%subclass of &%SurfaceChange where a &%ColorAttribute of the &%patient is altered. Note that the change in color may apply to just part of the object.","definitionSource":"source KIF","children":[],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"combine","label":"combine","definition":null,"definitionSource":null,"children":["wett"],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"combust","label":"combust","definition":null,"definitionSource":null,"children":[],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"committ","label":"committ","definition":null,"definitionSource":null,"children":[],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"Communication","label":"Communication","definition":"A &%SocialInteraction that involves the transfer of information between two or more &%CognitiveAgents. Note that &%Communication is closely related to, but essentially different from, &%ContentDevelopment. The latter involves the creation or modification of a &%ContentBearingObject, while &%Communication is the transfer of information for the purpose of conveying a message.","definitionSource":"source KIF","children":["Disseminating","LinguisticCommunication"],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"Community","label":"Community","definition":"People connected by shared place, identity, activity, or practice.","definitionSource":"project editorial","children":[],"alternateParents":[],"directParentCount":1,"provisionalParent":null},{"id":"compare","label":"compare","definition":null,"definitionSource":null,"children":[],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"ComplexityClass","label":"Complexity class","definition":"A set of computational problems sharing a resource bound.","definitionSource":"project editorial","children":[],"alternateParents":[],"directParentCount":1,"provisionalParent":null},{"id":"CompoundSubstance","label":"Compound Substance","definition":"The &%Class of &%Substances that contain two or more elements (&%ElementalSubstances) in definite proportion by weight. The composition of a pure compound will be invariant, regardless of the method of preparation. Compounds are composed of more than one kind of atom (element). The term molecule is often used for the smallest unit of a compound that still retains all of the properties of the compound. Examples: Table salt (sodium chloride, NaCl), sugar (sucrose, C_{12}H_{22}O_{11}), and water (H_2O).","definitionSource":"source KIF","children":["Molecule","Water"],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"ComputableFunction","label":"Computable function","definition":"A function for which an effective computation produces each result.","definitionSource":"project editorial","children":[],"alternateParents":[],"directParentCount":1,"provisionalParent":null},{"id":"ComputationalEntity","label":"Computational entity","definition":"An entity used to specify, perform, or analyze computation.","definitionSource":"project editorial","children":["Algorithm","ComplexityClass","ComputableFunction","RecursiveFunction","Automaton","FormalLanguage","Graph"],"alternateParents":[],"directParentCount":1,"provisionalParent":null},{"id":"ComputerLanguage","label":"Computer Language","definition":"The class of &%Languages designed for and interpreted by a computer.","definitionSource":"source KIF","children":[],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"Condensing","label":"Condensing","definition":"The &%Class of &%Processes where an &%Object is cooled and converted from a &%Gas to a &%Liquid.","definitionSource":"source KIF","children":[],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"ConstructedLanguage","label":"Constructed Language","definition":"An &%ConstructedLanguage is a &%HumanLanguage that did not evolve spontaneously within a language community, but rather had its core grammar and vocabulary invented by one or more language experts, often with an aim to produce a more grammatically regular language than any language that has evolved naturally. This &%Class includes languages like Esperanto that were created to facilitate international communication.","definitionSource":"source KIF","children":[],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"Constructing","label":"Constructing","definition":"The &%subclass of &%Making in which a &%StationaryArtifact is built.","definitionSource":"source KIF","children":[],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"ContentBearingObject","label":"Content Bearing Object","definition":"Any &%SelfConnectedObject that expresses content. This content may be a &%Proposition, e.g. when the &%ContentBearingObject is a &%Sentence or &%Text, or it may be a representation of an abstract or physical object, as with an &%Icon, a &%Word or a &%Phrase.","definitionSource":"source KIF","children":["Icon","LinguisticExpression","Series","SymbolicString"],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"ContentDevelopment","label":"Content Development","definition":"A &%subclass of &%IntentionalProcess in which content is modified, its form is altered or it is created anew.","definitionSource":"source KIF","children":["read","write"],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"Contest","label":"Contest","definition":"A &%SocialInteraction where the &%agent and &%patient are &%CognitiveAgents who are trying to defeat one another. Note that this concept is often applied in a metaphorical sense in natural language, when we speak, e.g., of the struggle of plants for space or sunlight, or of bacteria for food resources in some environment.","definitionSource":"source KIF","children":["Gaming","LegalAction","ViolentContest"],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"Continent","label":"Continent","definition":"As defined in the CIA World Fact Book, &%Continent covers seven land masses: &%Africa, &%NorthAmerica, &%SouthAmerica, &%Antarctica, &%Europe, &%Asia, and &%Oceania. Note that &%Australia, counted as a continent in some other systems, is included in &%Oceania in the Fact Book. As a consequence, there is no &%Nation which is also a &%Continent.","definitionSource":"source KIF","children":[],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"Contract","label":"Contract","definition":"An agreement recognized as creating enforceable commitments.","definitionSource":"project editorial","children":[],"alternateParents":[],"directParentCount":1,"provisionalParent":null},{"id":"Convention","label":"Convention","definition":"A practice or meaning maintained by social acceptance.","definitionSource":"project editorial","children":[],"alternateParents":[],"directParentCount":1,"provisionalParent":null},{"id":"conﬁne","label":"conﬁne","definition":null,"definitionSource":null,"children":[],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"Cooking","label":"Cooking","definition":"The &%Making of an &%instance of &%Food. Note that this can cover any preparation of &%Food, e.g. making a salad, cutting up fruit, etc. It does not necessarily involve the application of heat.","definitionSource":"source KIF","children":[],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"Cooling","label":"Cooling","definition":"Any &%Decreasing &%Process where the &%PhysicalQuantity decreased is a &%TemperatureMeasure.","definitionSource":"source KIF","children":[],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"Cooperation","label":"Cooperation","definition":"The &%subclass of &%SocialInteraction where the participants involved work together for the achievement of a common goal.","definitionSource":"source KIF","children":[],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"Coorporation","label":"Coorporation","definition":null,"definitionSource":null,"children":[],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"Corporation","label":"Corporation","definition":"A legally recognized organization with a distinct institutional identity.","definitionSource":"project editorial","children":[],"alternateParents":[],"directParentCount":1,"provisionalParent":null},{"id":"CorpuscularObject","label":"Corpuscular Object","definition":"A &%SelfConnectedObject whose parts have properties that are not shared by the whole.","definitionSource":"source KIF","children":["Artifact","OrganicObject"],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"Court","label":"Court","definition":"An institution authorized to interpret or apply law.","definitionSource":"project editorial","children":[],"alternateParents":[],"directParentCount":1,"provisionalParent":null},{"id":"cover","label":"cover","definition":null,"definitionSource":null,"children":[],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"Creation","label":"Creation","definition":"The &%subclass of &%Process in which something is created. Note that the thing created is specified with the &%result &%CaseRole.","definitionSource":"source KIF","children":["Making"],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"Currency","label":"Currency","definition":"A socially or institutionally accepted medium of exchange.","definitionSource":"project editorial","children":[],"alternateParents":[],"directParentCount":1,"provisionalParent":null},{"id":"Curve","label":"Curve","definition":"A one-dimensional geometric entity that varies continuously.","definitionSource":"project editorial","children":[],"alternateParents":[],"directParentCount":1,"provisionalParent":null},{"id":"cut","label":"cut","definition":null,"definitionSource":null,"children":[],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"Damaging","label":"Damaging","definition":"The &%Class of &%Processes where the &%agent brings about a situation where the &%patient no longer functions normally or as intended.","definitionSource":"source KIF","children":["Destruction"],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"dance","label":"dance","definition":null,"definitionSource":null,"children":[],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"Data","label":"Data","definition":"Recorded content available for interpretation or processing.","definitionSource":"project editorial","children":[],"alternateParents":[],"directParentCount":1,"provisionalParent":null},{"id":"Dataset","label":"Dataset","definition":"A collection of related data items treated as a unit.","definitionSource":"project editorial","children":[],"alternateParents":[],"directParentCount":1,"provisionalParent":null},{"id":"Death","label":"Death","definition":"The &%Process of dying.","definitionSource":"source KIF","children":[],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"declare","label":"declare","definition":null,"definitionSource":null,"children":[],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"decode","label":"decode","definition":null,"definitionSource":null,"children":[],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"Decreasing","label":"Decreasing","definition":"Any &%QuantityChange where the &%PhysicalQuantity is decreased.","definitionSource":"source KIF","children":["Cooling"],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"Definition","label":"Definition","definition":"An expression that fixes the meaning or use of a term.","definitionSource":"project editorial","children":[],"alternateParents":[],"directParentCount":1,"provisionalParent":null},{"id":"Description","label":"Description","definition":"A representation that conveys characteristics of an entity.","definitionSource":"project editorial","children":[],"alternateParents":[],"directParentCount":1,"provisionalParent":null},{"id":"Destruction","label":"Destruction","definition":"The &%subclass of &%Damagings in which the &%patient (or an essential element of the &%patient) is destroyed. Note that the difference between this concept and its superclass is solely one of extent.","definitionSource":"source KIF","children":["kill"],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"detach","label":"detach","definition":null,"definitionSource":null,"children":[],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"Device","label":"Device","definition":"A &%Device is an &%Artifact whose purpose is to serve as an &%instrument in a specific subclass of &%Process.","definitionSource":"source KIF","children":["EngineeringComponent","Machine","MusicalInstrument","TransportationDevice","Weapon"],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"DiagnosticProcess","label":"Diagnostic Process","definition":"A &%Process that is carried out for the purpose of determining the nature of a &%DiseaseOrSyndrome.","definitionSource":"source KIF","children":[],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"Digesting","label":"Digesting","definition":"The &%Process by which food that has been ingested is broken down into simpler chemical compounds and absorbed by the &%Organism.","definitionSource":"source KIF","children":[],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"Directing","label":"Directing","definition":"Instances of this &%Class urge some further action among the receivers. A &%Directing can be an &%Ordering, a &%Requesting or a &%Questioning.","definitionSource":"source KIF","children":["order","question","request"],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"Disposition","label":"Disposition","definition":"A property that makes an entity liable to behave in a certain way.","definitionSource":"project editorial","children":[],"alternateParents":[],"directParentCount":1,"provisionalParent":null},{"id":"Disseminating","label":"Disseminating","definition":"Any &%Communication that involves a single &%agent and many &%destinations. This covers the release of a published book, broadcasting, a theatrical performance, giving orders to assembled troops, delivering a public lecture, etc.","definitionSource":"source KIF","children":["advertise"],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"Document","label":"Document","definition":"A bounded representational work preserved for reading or reference.","definitionSource":"project editorial","children":[],"alternateParents":[],"directParentCount":1,"provisionalParent":null},{"id":"drink","label":"drink","definition":null,"definitionSource":null,"children":[],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"dry","label":"dry","definition":null,"definitionSource":null,"children":[],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"DualObjectProcess","label":"Dual Object Process","definition":"Any &%Process that requires two, nonidentical &%patients.","definitionSource":"source KIF","children":["attach","combine","detach","separate","substitute","Transaction"],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"eat","label":"eat","definition":null,"definitionSource":null,"children":[],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"EducationalOrganization","label":"Educational Organization","definition":"A &%EducationalOrganization is an institution of learning. Some examples are public and private K-12 schools, and colleges and universities.","definitionSource":"source KIF","children":[],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"EducationalProcess","label":"Educational Process","definition":"Any &%Process which is intended to result in &%Learning.","definitionSource":"source KIF","children":[],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"Electron","label":"Electron","definition":"&%SubatomicParticles that surround the &%AtomicNucleus. They have a negative charge.","definitionSource":"source KIF","children":[],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"ElementalSubstance","label":"Elemental Substance","definition":"The &%Class of &%PureSubstances that cannot be separated into two or more &%Substances by ordinary chemical (or physical) means. This excludes nuclear reactions. &%ElementalSubstances are composed of only one kind of atom. Examples: Iron (Fe), copper (Cu), and oxygen (O_2). &%ElementalSubstances are the simplest &%PureSubstances.","definitionSource":"source KIF","children":["Atom","Metal","SubatomicParticle"],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"Ellipse","label":"Ellipse","definition":"A closed plane curve whose distances to two foci have a constant sum.","definitionSource":"project editorial","children":[],"alternateParents":[],"directParentCount":1,"provisionalParent":null},{"id":"encode","label":"encode","definition":null,"definitionSource":null,"children":[],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"EngineeringComponent","label":"Engineering Component","definition":"A fundamental concept that applies in many engineering domains. An &%EngineeringComponent is an element of a &%Device that is a physically whole object, such as one might see listed as standard parts in a catalog. The main difference betweeen &%EngineeringComponents and arbitrary globs of matter is that &%EngineeringComponents are object-like in a modeling sense. Thus, an &%EngineeringComponent is not an arbtrary subregion, but a part of a system with a stable identity.","definitionSource":"source KIF","children":["EngineeringConnection"],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"EngineeringConnection","label":"Engineering Connection","definition":"An &%EngineeringConnection is an &%EngineeringComponent that represents a connection relationship between two other &%EngineeringComponents. It is a reification of the &%Predicate &%connectedEngineeringComponents. That means that whenever this &%Predicate holds between two &%EngineeringComponents, there exists an &%EngineeringConnection. The practical reason for reifying a relationship is to be able to attach other information about it. For example, one might want to say that a particular connection is associated with some shared parameters, or that it is of a particular type. &%EngineeringConnections are &%EngineeringComponents and can therefore be an &%engineeringSubcomponent of other &%EngineeringComponents. However, to provide for modular regularity in component systems, &%EngineeringConnections cannot be connected. For each pair of &%EngineeringComponents related by &%connectedEngineeringComponents, there exists at least one &%EngineeringConnection. However, that object may not be unique, and the same &%EngineeringConnection may be associated with several pairs of &%EngineeringComponents.","definitionSource":"source KIF","children":[],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"Entity","label":"Entity","definition":"That which can be referred to.","definitionSource":"project editorial","children":["RealizedEntity","AbstractEntity","Property","Relation"],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"Enzyme","label":"Enzyme","definition":"A complex &%Protein that is produced by living cells and which catalyzes specific biochemical reactions. There are six main types of enzymes: oxidoreductases, transferases, hydrolases, lyases, isomerases, and ligases.","definitionSource":"source KIF","children":[],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"EpistemicRelation","label":"Epistemic relation","definition":"A relation concerning knowledge, belief, evidence, or justification.","definitionSource":"project editorial","children":[],"alternateParents":[],"directParentCount":1,"provisionalParent":null},{"id":"EquivalenceRelation","label":"Equivalence relation","definition":"A relation grouping entities as interchangeable under specified criteria.","definitionSource":"project editorial","children":[],"alternateParents":[],"directParentCount":1,"provisionalParent":null},{"id":"EthnicGroup","label":"Ethnic Group","definition":"A &%GroupOfPeople whose &%members originate from the same &%GeographicArea or share the same &%Language and/or cultural practices.","definitionSource":"source KIF","children":[],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"Event","label":"Event","definition":"A bounded occurrence recognized as socially or otherwise significant.","definitionSource":"project editorial","children":[],"alternateParents":[],"directParentCount":1,"provisionalParent":null},{"id":"ExplanatoryRelation","label":"Explanatory relation","definition":"A relation in which one entity accounts for another.","definitionSource":"project editorial","children":[],"alternateParents":[],"directParentCount":1,"provisionalParent":null},{"id":"express","label":"express","definition":null,"definitionSource":null,"children":[],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"Fabric","label":"Fabric","definition":"&%Artifacts that are created by weaving together natural or synthetic fibers or by treating the skins of certain sorts of &%Animals. Note that this &%Class includes articles that are created by stitching together various types of fabrics, e.g. bedspreads. On the other hand, &%Clothing is not a &%subclass of &%Fabric, because many clothing items contain elements that are not fabrics.","definitionSource":"source KIF","children":[],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"Fact","label":"Fact","definition":"A proposition treated as supported or established.","definitionSource":"project editorial","children":[],"alternateParents":[],"directParentCount":1,"provisionalParent":null},{"id":"FamilyGroup","label":"Family Group","definition":"A &%GroupOfPeople whose &%members bear &%familyRelations to one another.","definitionSource":"source KIF","children":[],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"FatTissue","label":"Fat Tissue","definition":"Nonrigid &%Tissue that is composed largely of fat cells.","definitionSource":"source KIF","children":[],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"Feline","label":"Feline","definition":"The &%Class of &%Carnivores with completely separable toes, slim bodies, and rounded heads. All felines other than the cheetah have retractable claws.","definitionSource":"source KIF","children":[],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"Fern","label":"Fern","definition":"A &%NonFloweringPlant that contains vascular tissue. This class includes true ferns, as well as horsetails, club mosses, and whisk ferns.","definitionSource":"source KIF","children":[],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"FinancialTransaction","label":"Financial Transaction","definition":"A &%Transaction where an instance of &%FinancialInstrument is the subject of the action, and often is exchanged for something else.","definitionSource":"source KIF","children":["bet","buy","sell"],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"Fish","label":"Fish","definition":"A cold-blooded aquatic &%Vertebrate characterized by fins and breathing by gills. Included here are &%Fish having either a bony skeleton, such as a perch, or a cartilaginous skeleton, such as a shark. Also included are those &%Fish lacking a jaw, such as a lamprey or hagfish.","definitionSource":"source KIF","children":[],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"FloweringPlant","label":"Flowering Plant","definition":"A &%Plant that produces seeds and flowers. This class includes trees, shrubs, herbs, and flowers.","definitionSource":"source KIF","children":[],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"Food","label":"Food","definition":"Food that is fit for &%Human.","definitionSource":"source KIF","children":["Beverage","Fruit","Meat","Vegetable"],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"FormalExpression","label":"Formal expression","definition":"A well-formed symbolic construction in a formal language.","definitionSource":"project editorial","children":[],"alternateParents":[],"directParentCount":1,"provisionalParent":null},{"id":"FormalLanguage","label":"Formal language","definition":"A set of strings formed according to specified symbols and rules.","definitionSource":"project editorial","children":[],"alternateParents":[],"directParentCount":1,"provisionalParent":null},{"id":"Freezing","label":"Freezing","definition":"The &%Class of &%Processes where an &%Object is cooled and converted from a &%Liquid to a &%Solid.","definitionSource":"source KIF","children":[],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"FreshWaterArea","label":"Fresh Water Area","definition":"A &%WaterArea whose &%Water is not saline, e.g. most rivers and lakes.","definitionSource":"source KIF","children":[],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"Fruit","label":"Fruit","definition":"&%Fruits comes from the flowering &part of a &%FloweringPlant and contain &%Seeds. [Wikipedia]","definitionSource":"source KIF","children":[],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"Function","label":"Function","definition":"A rule or entity that assigns each allowed input a result.","definitionSource":"project editorial","children":[],"alternateParents":["Property"],"directParentCount":2,"provisionalParent":null},{"id":"Fungus","label":"Fungus","definition":"A eukaryotic &%Organism characterized by the absence of chlorophyll and the presence of rigid cell walls. Included here are both slime molds and true fungi such as yeasts, molds, mildews, and mushrooms.","definitionSource":"source KIF","children":[],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"Game","label":"Game","definition":"A &%Contest whose purpose is the enjoyment/stimulation of the participants or spectators of the &%Game.","definitionSource":"source KIF","children":["Sport"],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"Gaming","label":"Gaming","definition":null,"definitionSource":null,"children":[],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"GeographicArea","label":"Geographic Area","definition":"A geographic location, generally having definite boundaries. Note that this differs from its immediate superclass &%Region in that a &%GeographicArea is a three-dimensional &%Region of the earth. Accordingly, all astronomical objects other than earth and all one-dimensional and two-dimensional &%Regions are not classed under &%GeographicArea.","definitionSource":"source KIF","children":["GeopoliticalArea","LandArea","WaterArea"],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"GeometricEntity","label":"Geometric entity","definition":"An entity characterized by spatial form, location, or extension.","definitionSource":"project editorial","children":["Curve","Circle","Ellipse","Parabola","Hyperbola"],"alternateParents":[],"directParentCount":1,"provisionalParent":null},{"id":"GeopoliticalArea","label":"Geopolitical Area","definition":"Any &%GeographicArea which is associated with some sort of political structure. This class includes &%LandArea, &%Cities, districts of cities, counties, etc. Note that the identity of a &%GeopoliticalArea may remain constant after a change in borders.","definitionSource":"source KIF","children":[],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"Getting","label":"Getting","definition":"The &%subclass of &%ChangeOfPossession where the &%agent gets something. Note that the source from which something is obtained is specified with the &%origin &%CaseRole.","definitionSource":"source KIF","children":["borrow","UnilateralGetting"],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"Giving","label":"Giving","definition":"The &%subclass of &%ChangeOfPossession where the &%agent gives the &%destination something.","definitionSource":"source KIF","children":["lend","UnilateralGiving"],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"Gland","label":"Gland","definition":"An &%Organ that removes &%Substances from the &%Blood,alters them in some way, and then releases them.","definitionSource":"source KIF","children":[],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"Goal","label":"Goal","definition":"A desired or intended state treated as an end.","definitionSource":"project editorial","children":[],"alternateParents":[],"directParentCount":1,"provisionalParent":null},{"id":"Government","label":"Government","definition":"The ruling body of a &%GeopoliticalArea.","definitionSource":"source KIF","children":[],"alternateParents":[],"directParentCount":1,"provisionalParent":null},{"id":"graduate","label":"graduate","definition":null,"definitionSource":null,"children":[],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"Graph","label":"Graph","definition":"An entity consisting of vertices connected by edges.","definitionSource":"project editorial","children":[],"alternateParents":[],"directParentCount":1,"provisionalParent":null},{"id":"Group","label":"Group","definition":"A &%CollectionOfObjects of &%Agents, e.g. a flock of sheep, a herd of goats, or the local Boy Scout troop.","definitionSource":"source KIF","children":["AgeGroup","EthnicGroup","FamilyGroup","Organization"],"alternateParents":[],"directParentCount":1,"provisionalParent":null},{"id":"Growth","label":"Growth","definition":"The &%Process of biological development in which an &%Organism or part of an &%Organism changes its form or its size.","definitionSource":"source KIF","children":[],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"Guiding","label":"Guiding","definition":"Any &%IntentionalProcess where the &%agent tries to direct the behavior of another &%Object, whether an &%AutonomousAgent or not.","definitionSource":"source KIF","children":["EducationalProcess","Managing","Steering"],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"hear","label":"hear","definition":null,"definitionSource":null,"children":[],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"Heating","label":"Heating","definition":"Any &%Increasing &%Process where the &%PhysicalQuantity increased is a &%TemperatureMeasure.","definitionSource":"source KIF","children":[],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"hire","label":"hire","definition":null,"definitionSource":null,"children":[],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"Hole","label":"Hole","definition":null,"definitionSource":null,"children":[],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"Hominid","label":"Hominid","definition":"Includes &%Humans and relatively recent ancestors of &%Humans.","definitionSource":"source KIF","children":["Human"],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"HoofedMammal","label":"Hoofed Mammal","definition":"The &%Class of quadruped &%Mammals with hooves. Includes horses, cows, sheep, pigs, antelope, etc.","definitionSource":"source KIF","children":[],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"Hormone","label":"Hormone","definition":"In &%Animals, a chemical secreted by an endocrine gland whose products are released into the circulating fluid. &%Plant hormones or synthetic hormones which are used only to alter or control various physiologic processes, e.g., reproductive control agents, are assigned to the &%Class &%BiologicallyActiveSubstance. &%Hormones act as chemical messengers and regulate various physiologic processes such as growth, reproduction, metabolism, etc. They usually fall into two broad categories, viz. steroid hormones and peptide hormones.","definitionSource":"source KIF","children":[],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"Human","label":"Human","definition":"Modern man, the only remaining species of the Homo genus.","definitionSource":"source KIF","children":[],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"HumanLanguage","label":"Human Language","definition":"The &%subclass of &%Languages used by &%Humans.","definitionSource":"source KIF","children":["ConstructedLanguage","NaturalLanguage"],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"Hyperbola","label":"Hyperbola","definition":"A curve whose points have a constant difference of distances to two foci.","definitionSource":"project editorial","children":[],"alternateParents":[],"directParentCount":1,"provisionalParent":null},{"id":"Icon","label":"Icon","definition":"This is the subclass of &%ContentBearingPhysical which are not part of a &%Language and which have some sort of similarity with the &%Objects that they represent. This &%Class would include symbolic roadway signs, representational art works, photographs, etc.","definitionSource":"source KIF","children":[],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"IdentityRelation","label":"Identity relation","definition":"A relation stating that entities are the same entity.","definitionSource":"project editorial","children":[],"alternateParents":[],"directParentCount":1,"provisionalParent":null},{"id":"Image","label":"Image","definition":"A representation that conveys visual form or appearance.","definitionSource":"project editorial","children":[],"alternateParents":[],"directParentCount":1,"provisionalParent":null},{"id":"impact","label":"impact","definition":null,"definitionSource":null,"children":[],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"Impelling","label":"Impelling","definition":"The &%subclass of &%Transfer where the &%patient travels through space by means of a sudden, forceful event. Some examples would be shooting, throwing, tossing, etc.","definitionSource":"source KIF","children":["shoot"],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"Increasing","label":"Increasing","definition":"Any &%QuantityChange where the &%PhysicalQuantity is increased.","definitionSource":"source KIF","children":["Heating"],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"InformationalEntity","label":"Informational entity","definition":"An entity whose identity depends on content, evidence, or information.","definitionSource":"project editorial","children":["Data","Record","Dataset","Signal","Message","Observation","Measurement","Fact","Knowledge","Belief"],"alternateParents":[],"directParentCount":1,"provisionalParent":null},{"id":"Ingesting","label":"Ingesting","definition":"The &%Process by which food or &%Medicine is taken into an &%Animal.","definitionSource":"source KIF","children":["drink","eat"],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"Injuring","label":"Injuring","definition":"The process of creating a traumatic wound or injury. Since &%Injuring is not possible without some biologic function of the organism being injured, it is a subclass of &%BiologicalProcess.","definitionSource":"source KIF","children":["poison"],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"Institution","label":"Institution","definition":"A durable social arrangement organized around recognized practices or rules.","definitionSource":"project editorial","children":[],"alternateParents":[],"directParentCount":1,"provisionalParent":null},{"id":"InstitutionalEntity","label":"Institutional entity","definition":"A durable rule-governed social entity with recognized functions or authority.","definitionSource":"project editorial","children":["Organization","Government","Corporation","Club","School","Court","Market","Currency","Law","Contract","License","Policy","Office"],"alternateParents":[],"directParentCount":1,"provisionalParent":null},{"id":"InstitutionalRelation","label":"Institutional relation","definition":"A relation defined by an institution, rule, or office.","definitionSource":"project editorial","children":[],"alternateParents":[],"directParentCount":1,"provisionalParent":null},{"id":"IntentionalProcess","label":"Intentional Process","definition":"A &%Process that has a specific purpose for the &%AutonomousAgent who performs it.","definitionSource":"source KIF","children":["ContentDevelopment","Guiding","Keeping","Maintaining","Maneuver","OrganizationalProcess","Poking","RecreationOrExercise","Repairing","Searching","SocialInteraction"],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"IntentionalPsychologicalProcess","label":"Intentional Psychological Process","definition":"An &%IntentionalProcess is a process that can be realized entirely within the mind or brain of an &%Organism. Thus,for example, &%Reasoning is a subclass of &%IntentionalPsychologicalProcess, because one can reason simply by exercising one's mind/brain. On the other hand, &%RecreationOrExercise is not a subclass of &%IntentionalPsychologicalProcess, because many instances of &%RecreationOrExercise necessarily have &%subProcesses of &%BodyMotion.","definitionSource":"source KIF","children":["calculate","classify","compare","learn","plan","predict","reason","select"],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"InternalChange","label":"Internal Change","definition":"&%Processes which involve altering an internal property of an &%Object, e.g. the shape of the &%Object, its coloring, its structure, etc. &%Processes that are not instances of this class include changes that only affect the relationship to other objects, e.g. changes in spatial or temporal location.","definitionSource":"source KIF","children":["BiologicalProcess","ChemicalProcess","Creation","Damaging","QuantityChange","StateChange","SurfaceChange"],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"Invertebrate","label":"Invertebrate","definition":"An &%Animal which has no spinal column.","definitionSource":"source KIF","children":[],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"Investigating","label":"Investigating","definition":"The class of &%IntentionalPsychologicalProcesses where the &%agent attempts to obtain information (i.e. a &%Proposition denoted by a &%Formula).","definitionSource":"source KIF","children":["DiagnosticProcess"],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"Island","label":"Island","definition":"A &%LandArea that is completely surrounded by a &%WaterArea.","definitionSource":"source KIF","children":[],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"Item","label":"Item","definition":"An object distinguished as a single unit.","definitionSource":"project editorial","children":["AbioticObject","BiologicalObject","Artifact"],"alternateParents":[],"directParentCount":1},{"id":"JoiningAnOrganization","label":"Joining An Organization","definition":"The &%OrganizationalProcess of becoming a &%member of an &%Organization.","definitionSource":"source KIF","children":["hire","matriculate"],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"Keeping","label":"Keeping","definition":"The &%Class of &%Processes where the &%agent keeps something in a particular location for an extended period of time.","definitionSource":"source KIF","children":["conﬁne"],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"kill","label":"kill","definition":null,"definitionSource":null,"children":[],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"Knowledge","label":"Knowledge","definition":"Information regarded as understood, justified, or usable.","definitionSource":"project editorial","children":[],"alternateParents":[],"directParentCount":1,"provisionalParent":null},{"id":"Label","label":"Label","definition":"A name or mark attached to an entity for identification or classification.","definitionSource":"project editorial","children":[],"alternateParents":[],"directParentCount":1,"provisionalParent":null},{"id":"LandArea","label":"Land Area","definition":"An area which is predominantly solid ground, e.g. a &%Nation, a mountain, a desert, etc. Note that a &%LandArea may contain some relatively small &%WaterAreas. For example, Australia is a &%LandArea even though it contains various rivers and lakes.","definitionSource":"source KIF","children":["Address","Continent","Island","State"],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"Language","label":"Language","definition":"A system of signs for expressing thought. The system can be either natural or artificial, i.e. something that emerges gradually as a cultural artifact or something that is intentionally created by a person or group of people.","definitionSource":"source KIF","children":["AnimalLanguage","ArtiﬁcialLanguage","HumanLanguage"],"alternateParents":[],"directParentCount":1,"provisionalParent":null},{"id":"Law","label":"Law","definition":"A rule recognized and enforced by an authority or legal system.","definitionSource":"project editorial","children":[],"alternateParents":[],"directParentCount":1,"provisionalParent":null},{"id":"learn","label":"learn","definition":null,"definitionSource":null,"children":[],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"LeavingAnOrganization","label":"Leaving An Organization","definition":"The &%OrganizationalProcess of leaving an &%Organization, whether voluntarily or involuntarily.","definitionSource":"source KIF","children":["graduate","terminate_Employment"],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"LegalAction","label":"Legal Action","definition":"Any &%Process where a &%CognitiveAgent seeks to obtain something through a court of law.","definitionSource":"source KIF","children":[],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"lend","label":"lend","definition":null,"definitionSource":null,"children":[],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"License","label":"License","definition":"An authorization granted under specified conditions.","definitionSource":"project editorial","children":[],"alternateParents":[],"directParentCount":1,"provisionalParent":null},{"id":"LinguisticCommunication","label":"Linguistic Communication","definition":"A &%Communication that involves the transfer of information via a &%LinguisticExpression.","definitionSource":"source KIF","children":["committ","declare","Directing","express","state"],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"LinguisticExpression","label":"Linguistic Expression","definition":"This is the subclass of &%ContentBearingPhysical which are language-related. Note that this &%Class encompasses both &%Language and the the elements of &%Languages, e.g. &%Words.","definitionSource":"source KIF","children":["Language","Morpheme","Phrase","Word"],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"LogicalEntity","label":"Logical entity","definition":"An entity used to express or evaluate logical form.","definitionSource":"project editorial","children":[],"alternateParents":[],"directParentCount":1,"provisionalParent":null},{"id":"LogicalProperty","label":"Logical property","definition":"A property defined by logical form or consequence.","definitionSource":"project editorial","children":[],"alternateParents":[],"directParentCount":1,"provisionalParent":null},{"id":"LogicalRelation","label":"Logical relation","definition":"A relation defined by logical form or consequence.","definitionSource":"project editorial","children":[],"alternateParents":[],"directParentCount":1,"provisionalParent":null},{"id":"Machine","label":"Machine","definition":"&%Machines are &%Devices that that have a well-defined &%resource and &%result and that automatically convert the &%resource into the &%result.","definitionSource":"source KIF","children":[],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"Maintaining","label":"Maintaining","definition":"The &%Class of &%Processes where the &%agent cares for or maintains the &%Object.","definitionSource":"source KIF","children":[],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"Making","label":"Making","definition":"The &%subclass of &%Creation in which an individual &%Artifact or a type of &%Artifact is made.","definitionSource":"source KIF","children":["Constructing","Cooking","Manufacture"],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"Mammal","label":"Mammal","definition":"A &%Vertebrate having a constant body temperature and characterized by the presence of hair, mammary glands, and sweat glands.","definitionSource":"source KIF","children":["AquaticMammal","Carnivore","HoofedMammal","Marsupial","Primate","Rodent"],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"Managing","label":"Managing","definition":"&%OrganizationalProcesses that involve overseeing the activities of others. Note the key differences between &%RegulatoryProcess and its sibling &%Managing. The latter implies a long-term relationship between the manager and the managed, while the former implies a normative standard to which the activities of the regulated are referred.","definitionSource":"source KIF","children":[],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"Maneuver","label":"Maneuver","definition":"An intentional move or play within a &%Contest. In many cases, a &%Maneuver is a realization of part of a strategy for winning the &%Contest, but it also may be just an arbitrary or semi-arbitrary division of the overarching &%Contest, e.g. innings in a baseball game.","definitionSource":"source KIF","children":[],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"Manufacture","label":"Manufacture","definition":"The &%Making of &%Artifacts on a mass scale.","definitionSource":"source KIF","children":["Publication"],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"Market","label":"Market","definition":"An institution or arrangement for exchange among participants.","definitionSource":"project editorial","children":[],"alternateParents":[],"directParentCount":1,"provisionalParent":null},{"id":"Marsupial","label":"Marsupial","definition":"The &%Class of &%Mammals which have a pouch for their young.","definitionSource":"source KIF","children":[],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"MathematicalEntity","label":"Mathematical entity","definition":"An abstract entity used in mathematical description, reasoning, or construction.","definitionSource":"project editorial","children":["Number","Set","Function","LogicalEntity","AlgebraicEntity","GeometricEntity","TopologicalEntity","AnalyticEntity","ProbabilityEntity","ComputationalEntity","PhysicalSystemModel","FormalExpression","Proposition","Theorem","Proof","Definition","MathematicalModel"],"alternateParents":[],"directParentCount":1,"provisionalParent":null},{"id":"MathematicalModel","label":"Mathematical model","definition":"A mathematical representation of a target system or situation.","definitionSource":"project editorial","children":[],"alternateParents":[],"directParentCount":1,"provisionalParent":null},{"id":"MathematicalProperty","label":"Mathematical property","definition":"A characteristic defined or established mathematically.","definitionSource":"project editorial","children":[],"alternateParents":[],"directParentCount":1,"provisionalParent":null},{"id":"MathematicalRelation","label":"Mathematical relation","definition":"A relation defined between mathematical entities.","definitionSource":"project editorial","children":[],"alternateParents":[],"directParentCount":1,"provisionalParent":null},{"id":"matriculate","label":"matriculate","definition":null,"definitionSource":null,"children":[],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"Measurement","label":"Measurement","definition":"A reported comparison of a quantity with a scale or standard.","definitionSource":"project editorial","children":[],"alternateParents":[],"directParentCount":1,"provisionalParent":null},{"id":"Meat","label":"Meat","definition":"Any food which was originally part of an &%Animal and is not ingested by drinking, including eggs and animal blood that is eaten as food. Note that this class covers both raw meat and meat that has been prepared in some way, e.g. by cooking. Note too that preparations involving &%Meat and &%FruitOrVegetable are classed directly under &%Food.","definitionSource":"source KIF","children":[],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"Meeting","label":"Meeting","definition":"The coming together of two or more &%CognitiveAgents for the purpose of &%Communication. This covers informal meetings, e.g. visits with family members, and formal meetings, e.g. a board of directors meeting.","definitionSource":"source KIF","children":[],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"Melting","label":"Melting","definition":"The &%Class of &%Processes where an &%Object is heated and converted from a &%Solid to a &%Liquid.","definitionSource":"source KIF","children":[],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"Message","label":"Message","definition":"Information intended to be conveyed from a source to a recipient.","definitionSource":"project editorial","children":[],"alternateParents":[],"directParentCount":1,"provisionalParent":null},{"id":"Metal","label":"Metal","definition":"A &%Metal is an &%ElementalSubstance that conducts heat and electricity, is shiny and reflects many colors of light, and can be hammered into sheets or drawn into wire. About 80% of the known chemical elements (&%ElementalSubstances) are metals.","definitionSource":"source KIF","children":[],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"MicroOrganism","label":"Micro Organism","definition":null,"definitionSource":null,"children":["Bacterium","Virus"],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"MilitaryProcess","label":"Military Process","definition":"&%Process that is carried out by a military organization. Note that this class covers &%Processes, e.g. military operations, that are the result of careful planning, as well as those which are unscripted.","definitionSource":"source KIF","children":[],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"Mineral","label":"Mineral","definition":"Any of various naturally occurring homogeneous substances (such as stone, coal, salt, sulfur, sand, petroleum), or synthetic substances having the chemical composition and crystalline form and properties of a naturally occurring mineral.","definitionSource":"source KIF","children":[],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"Mixture","label":"Mixture","definition":"A &%Mixture is two or more &%PureSubstances, combined in varying proportions - each retaining its own specific properties. The components of a &%Mixture can be separated by physical means, i.e. without the making and breaking of chemical bonds. Examples: Air, table salt thoroughly dissolved in water, milk, wood, and concrete.","definitionSource":"source KIF","children":["BodySubstance","Mineral","Solution"],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"ModalProperty","label":"Modal property","definition":"A property concerning possibility, necessity, or contingency.","definitionSource":"project editorial","children":[],"alternateParents":[],"directParentCount":1,"provisionalParent":null},{"id":"Model","label":"Model","definition":"A representation used to describe, explain, predict, or guide.","definitionSource":"project editorial","children":[],"alternateParents":[],"directParentCount":1,"provisionalParent":null},{"id":"Molecule","label":"Molecule","definition":"A molecule is the smallest unit of matter of a &%CompoundSubstance that retains all the physical and chemical properties of that substance, e.g., Ne, H2, H2O. A molecule is two or more &%Atoms linked by a chemical bond.","definitionSource":"source KIF","children":[],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"Monkey","label":"Monkey","definition":"Various &%Primates with relatively long tails.","definitionSource":"source KIF","children":[],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"Morpheme","label":"Morpheme","definition":"Part of a &%Word which cannot be subdivided and which expresses a meaning.","definitionSource":"source KIF","children":[],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"Moss","label":"Moss","definition":"A &%NonFloweringPlant without true roots and little if any vascular tissue.","definitionSource":"source KIF","children":[],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"Motion","label":"Motion","definition":"Any &%Process of movement.","definitionSource":"source KIF","children":["BodyMotion","Radiating","Removing","Transfer"],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"MotionPicture","label":"Motion Picture","definition":"A &%ContentBearingObject which depicts motion (and which may have an audio or text component as well). This &%Class covers films, videos, etc.","definitionSource":"source KIF","children":[],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"Muscle","label":"Muscle","definition":"A &%Muscle is a kind of &%BodyPart consisting of contractile tissue that allows for movement of the &%AnatomicalStructure through the contraction and relaxation of fibers.","definitionSource":"source KIF","children":[],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"music","label":"music","definition":null,"definitionSource":null,"children":[],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"MusicalInstrument","label":"Musical Instrument","definition":"A &%Device which is manipulated by a &%Human and whose purpose is &%MakingMusic.","definitionSource":"source KIF","children":[],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"Name","label":"Name","definition":"A symbol or expression used to identify an entity.","definitionSource":"project editorial","children":[],"alternateParents":[],"directParentCount":1,"provisionalParent":null},{"id":"NaturalLanguage","label":"Natural Language","definition":"The &%subclass of &%HumanLanguages which are not designed and which evolve from generation to generation. This &%Class includes all of the national languages, e.g. English, Spanish, Japanese, etc. Note that this class includes dialects of natural languages.","definitionSource":"source KIF","children":[],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"Neutron","label":"Neutron","definition":"Components of the &%AtomicNucleus. They have no charge.","definitionSource":"source KIF","children":[],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"NonFloweringPlant","label":"Non Flowering Plant","definition":"A &%Plant that reproduces with spores and does not produce flowers.","definitionSource":"source KIF","children":["Alga","Fern","Fungus","Moss"],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"Norm","label":"Norm","definition":"A rule or standard specifying expected conduct or form.","definitionSource":"project editorial","children":[],"alternateParents":[],"directParentCount":1,"provisionalParent":null},{"id":"Notation","label":"Notation","definition":"A conventional system of symbols used to express entities or relations.","definitionSource":"project editorial","children":[],"alternateParents":[],"directParentCount":1,"provisionalParent":null},{"id":"Noun","label":"Noun","definition":"One of the parts of speech. The &%Class of &%Words that conventionally denote &%Objects.","definitionSource":"source KIF","children":[],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"NounPhrase","label":"Noun Phrase","definition":"A &%Phrase that has the same function as a &%Noun.","definitionSource":"source KIF","children":[],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"Number","label":"Number","definition":"An entity that specifies a count, magnitude, or position.","definitionSource":"project editorial","children":[],"alternateParents":[],"directParentCount":1,"provisionalParent":null},{"id":"Nutrient","label":"Nutrient","definition":"A &%BiologicallyActiveSubstance required by an &%Organism. It is generally ingested as food, and it is of primary interest because of its role in the biologic functioning of the &%Organism.","definitionSource":"source K
