IF","children":["Carbohydrate","Protein","Vitamin"],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"Object","label":"Object","definition":"A realized entity regarded as persisting through time.","definitionSource":"source KIF","children":["Item","Collection","Region","Agent","SelfConnectedObject"],"alternateParents":[],"directParentCount":1,"provisionalParent":null},{"id":"Obligation","label":"Obligation","definition":"A requirement binding an agent to an action or state.","definitionSource":"project editorial","children":[],"alternateParents":[],"directParentCount":1,"provisionalParent":null},{"id":"Observation","label":"Observation","definition":"Information acquired by attending to an entity or event.","definitionSource":"project editorial","children":[],"alternateParents":[],"directParentCount":1,"provisionalParent":null},{"id":"Office","label":"Office","definition":"An institutional position or the authority associated with it.","definitionSource":"project editorial","children":[],"alternateParents":[],"directParentCount":1,"provisionalParent":null},{"id":"OntologyRepresentation","label":"Ontology","definition":"A structured account of kinds and relations in a domain.","definitionSource":"project editorial","children":[],"alternateParents":[],"directParentCount":1,"provisionalParent":null},{"id":"order","label":"order","definition":null,"definitionSource":null,"children":[],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"Organ","label":"Organ","definition":"A somewhat independent &%BodyPart that performs a specialized function. Note that this functional definition covers bodily systems, e.g. the digestive system or the central nervous system.","definitionSource":"source KIF","children":["Gland"],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"OrganOrTissueProcess","label":"Organ Or Tissue Process","definition":"A &%PhysiologicProcess of a particular &%Organ or &%Tissue.","definitionSource":"source KIF","children":[],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"OrganicObject","label":"Organic Object","definition":"This class encompasses &%Organisms, &%CorpuscularObjects that are parts of &%Organisms, i.e. &%BodyParts, and &%CorpuscularObjects that are nonintentionally produced by &%Organisms, e.g. &%ReproductiveBodies.","definitionSource":"source KIF","children":["AnatomicalStructure","Organism"],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"Organism","label":"Organism","definition":"Generally, a living individual, including all &%Plants and &%Animals.","definitionSource":"source KIF","children":["Animal","MicroOrganism","Plant","ToxicOrganism"],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"OrganismProcess","label":"Organism Process","definition":"A physiologic function of the &%Organism as a whole, of multiple organ systems or of multiple &%Organs or &%Tissues.","definitionSource":"source KIF","children":["Birth","breath","Death","Digesting","Growth","Ingesting","Replication"],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"Organization","label":"Organization","definition":"An &%Organization is a corporate or similar institution. The &%members of an &%Organization typically have a common purpose or function. Note that this class also covers divisions, departments, etc. of organizations. For example, both the Shell Oil Corporation and the accounting department at Shell would both be instances of &%Organization. Note too that the existence of an &%Organization is dependent on the existence of at least one &%member (since &%Organization is a subclass of &%CollectionOfObjects). Accordingly, in cases of purely legal organizations, a fictitious &%member should be assumed.","definitionSource":"source KIF","children":["Coorporation","EducationalOrganization","PoliticalOrganization","ReligiousOrganization"],"alternateParents":[],"directParentCount":1,"provisionalParent":null},{"id":"OrganizationUnit","label":"Organization Unit","definition":null,"definitionSource":null,"children":[],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"OrganizationalProcess","label":"Organizational Process","definition":"An &%IntentionalProcess that involves an &%Organization.","definitionSource":"source KIF","children":["JoiningAnOrganization","LeavingAnOrganization","PoliticalProcess","RegulatoryProcess","ReligiousProcess"],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"Parabola","label":"Parabola","definition":"A plane curve whose points are equidistant from a focus and a directrix.","definitionSource":"project editorial","children":[],"alternateParents":[],"directParentCount":1,"provisionalParent":null},{"id":"PartWholeRelation","label":"Part-whole relation","definition":"A relation between a whole and one of its parts.","definitionSource":"project editorial","children":[],"alternateParents":[],"directParentCount":1,"provisionalParent":null},{"id":"ParticipationRelation","label":"Participation relation","definition":"A relation connecting an entity with an event or process it takes part in.","definitionSource":"project editorial","children":[],"alternateParents":[],"directParentCount":1,"provisionalParent":null},{"id":"Particle","label":"Particle","definition":null,"definitionSource":null,"children":[],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"Patent","label":"Patent","definition":"A &%Certificate that expresses the content of an invention that has been accorded legal protection by a governemental entity.","definitionSource":"source KIF","children":[],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"PathologicProcess","label":"Pathologic Process","definition":"A disordered process, activity, or state of the &%Organism as a whole, of a body system or systems, or of multiple &%Organs or &%Tissues. Included here are normal responses to a negative stimulus as well as patholologic conditions or states that are less specific than a disease. Pathologic functions frequently have systemic effects.","definitionSource":"source KIF","children":["Injuring"],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"Perception","label":"Perception","definition":"Sensing some aspect of the material world. Note that the &%agent of this sensing is assumed to be an &%Animal.","definitionSource":"source KIF","children":["hear","see","smell","TactilePerception","taste"],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"PerceptualRelation","label":"Perceptual relation","definition":"A relation between a perceiver and what is perceived.","definitionSource":"project editorial","children":[],"alternateParents":[],"directParentCount":1,"provisionalParent":null},{"id":"Periodical","label":"Periodical","definition":"A &%Series whose elements are published separately and on a periodic basis.","definitionSource":"source KIF","children":[],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"Person","label":"Person","definition":"An individual human being considered as a social participant.","definitionSource":"project editorial","children":[],"alternateParents":[],"directParentCount":1,"provisionalParent":null},{"id":"Phrase","label":"Phrase","definition":"A set of &%Words in a &%Language which form a unit, i.e. express a meaning in the &%Language.","definitionSource":"source KIF","children":["NounPhrase","PrepositionalPhrase","VerbPhrase"],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"PhysicalSystemModel","label":"Physical system model","definition":"A mathematical entity representing a physical system.","definitionSource":"project editorial","children":[],"alternateParents":[],"directParentCount":1,"provisionalParent":null},{"id":"PhysiologicProcess","label":"Physiologic Process","definition":"A normal process of an &%Organism or part of an &%Organism.","definitionSource":"source KIF","children":["OrganOrTissueProcess","OrganismProcess"],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"plan","label":"plan","definition":null,"definitionSource":null,"children":[],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"Plant","label":"Plant","definition":"An &%Organism having cellulose cell walls, growing by synthesis of &%Substances, generally distinguished by the presence of chlorophyll, and lacking the power of locomotion.","definitionSource":"source KIF","children":["FloweringPlant","NonFloweringPlant"],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"poison","label":"poison","definition":null,"definitionSource":null,"children":[],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"Poking","label":"Poking","definition":"The &%Class of &%Processes where the &%agent pierces the surface of the &%Object with an &%instrument.","definitionSource":"source KIF","children":["cut"],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"Policy","label":"Policy","definition":"A rule or principle adopted to guide decisions or conduct.","definitionSource":"project editorial","children":[],"alternateParents":[],"directParentCount":1,"provisionalParent":null},{"id":"PoliticalOrganization","label":"Political Organization","definition":"An &%Organization that is attempting to bring about some sort of political change.","definitionSource":"source KIF","children":["Government"],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"PoliticalProcess","label":"Political Process","definition":"An &%OrganizationalProcess carried out by, for or against officially constituted governments. Some examples would be voting on proposed legislation, electing a government representative, or even overthrowing a government in a revolution.","definitionSource":"source KIF","children":["MilitaryProcess"],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"Practice","label":"Practice","definition":"A recurring activity or method maintained by participants.","definitionSource":"project editorial","children":[],"alternateParents":[],"directParentCount":1,"provisionalParent":null},{"id":"predict","label":"predict","definition":null,"definitionSource":null,"children":[],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"Preference","label":"Preference","definition":"A disposition to favor one option or state over another.","definitionSource":"project editorial","children":[],"alternateParents":[],"directParentCount":1,"provisionalParent":null},{"id":"PrepositionalPhrase","label":"Prepositional Phrase","definition":"A &%Phrase that begins with a preposition and that functions as an &%Adjective or an &%Adverb.","definitionSource":"source KIF","children":[],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"pretend","label":"pretend","definition":null,"definitionSource":null,"children":[],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"Primate","label":"Primate","definition":"The &%Class of &%Mammals which are &%Primates.","definitionSource":"source KIF","children":["Ape","Hominid","Monkey"],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"ProbabilityEntity","label":"Probability entity","definition":"An entity used to represent chance, uncertainty, or distribution.","definitionSource":"project editorial","children":[],"alternateParents":[],"directParentCount":1,"provisionalParent":null},{"id":"Process","label":"Process","definition":"A realized entity regarded as occurring through time.","definitionSource":"source KIF","children":["DualObjectProcess","IntentionalProcess","InternalChange","Motion","ShapeChange"],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"Product","label":"Product","definition":"An &%Artifact that is produced by &%Manufacture.","definitionSource":"source KIF","children":[],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"Proof","label":"Proof","definition":"A finite argument that establishes a proposition from accepted premises.","definitionSource":"project editorial","children":[],"alternateParents":[],"directParentCount":1,"provisionalParent":null},{"id":"Property","label":"Property","definition":"An entity that takes one argument.","definitionSource":"project editorial","children":["Quality","Quantity","QualityValue","Disposition","Capability","Purpose","Norm","Obligation","Goal","Preference","ModalProperty","LogicalProperty","MathematicalProperty"],"alternateParents":[],"directParentCount":1,"provisionalParent":null},{"id":"Proposition","label":"Proposition","definition":"An entity that can be asserted and evaluated as true or false.","definitionSource":"project editorial","children":[],"alternateParents":[],"directParentCount":1,"provisionalParent":null},{"id":"Protein","label":"Protein","definition":"A &%Nutrient made up of amino acids joined by peptide bonds.","definitionSource":"source KIF","children":["Enzyme"],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"Proton","label":"Proton","definition":"Components of the &%AtomicNucleus. They have a positive charge.","definitionSource":"source KIF","children":[],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"ProvenanceRelation","label":"Provenance relation","definition":"A relation recording an entity's source, derivation, or history.","definitionSource":"project editorial","children":[],"alternateParents":[],"directParentCount":1,"provisionalParent":null},{"id":"PsychologicalProcess","label":"Psychological Process","definition":"A &%BiologicalProcess which takes place in the mind or brain of an &%Organism and which may be manifested in the behavior of the &%Organism.","definitionSource":"source KIF","children":["IntentionalPsychologicalProcess","Perception","Remembering"],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"Publication","label":"Publication","definition":"The &%Manufacture of &%Texts. Note that there is no implication that the &%Texts are distributed. Such distribution, when it occurs, is an instance of &%Dissemination.","definitionSource":"source KIF","children":[],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"PureSubstance","label":"Pure Substance","definition":"The &%Class of &%Substances with constant composition. A &%PureSubstance can be either an element (&%ElementalSubstance) or a compound of elements (&%CompoundSubstance). Examples: Table salt (sodium chloride, NaCl), sugar (sucrose, C_{12}H_{22}O_{11}), water (H_2O), iron (Fe), copper (Cu), and oxygen (O_2).","definitionSource":"source KIF","children":["CompoundSubstance","ElementalSubstance"],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"Purpose","label":"Purpose","definition":"An intended end that guides an entity or activity.","definitionSource":"project editorial","children":[],"alternateParents":[],"directParentCount":1,"provisionalParent":null},{"id":"pursue","label":"pursue","definition":null,"definitionSource":null,"children":[],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"Putting","label":"Putting","definition":"The &%Class of &%Processes where something is put in a location. Note that the location is specified with the &%CaseRole &%destination.","definitionSource":"source KIF","children":["cover"],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"Quality","label":"Quality","definition":"A characteristic describing how an entity is.","definitionSource":"project editorial","children":[],"alternateParents":[],"directParentCount":1,"provisionalParent":null},{"id":"QualityValue","label":"Quality value","definition":"A value that specifies a quality on a scale or comparison.","definitionSource":"project editorial","children":[],"alternateParents":[],"directParentCount":1,"provisionalParent":null},{"id":"Quantity","label":"Quantity","definition":"A property specifying how many, how much, or to what extent.","definitionSource":"project editorial","children":[],"alternateParents":[],"directParentCount":1,"provisionalParent":null},{"id":"QuantityChange","label":"Quantity Change","definition":"Any &%InternalChange where a &%PhysicalQuantity associated with the &%patient is altered.","definitionSource":"source KIF","children":["Decreasing","Increasing"],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"question","label":"question","definition":null,"definitionSource":null,"children":[],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"Radiating","label":"Radiating","definition":"Processes in which some form of electromagnetic radiation, e.g. radio waves, light waves, electrical energy, etc., is given off or absorbed by something else.","definitionSource":"source KIF","children":["RadiatingLight","RadiatingSound"],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"RadiatingLight","label":"Radiating Light","definition":"The &%subclass of &%Radiating in which light is given off or absorbed. Some examples include blinking, flashing, and glittering.","definitionSource":"source KIF","children":[],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"RadiatingSound","label":"Radiating Sound","definition":"The &%subclass of &%Radiating in which sound waves are given off or absorbed. Some examples include creaking, roaring, and whistling.","definitionSource":"source KIF","children":["music"],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"read","label":"read","definition":null,"definitionSource":null,"children":[],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"RealizedEntity","label":"Realized entity","definition":"An entity that takes no arguments and has spatiotemporal embodiment.","definitionSource":"project editorial","children":["Object","Process"],"alternateParents":[],"directParentCount":1,"provisionalParent":null},{"id":"reason","label":"reason","definition":null,"definitionSource":null,"children":[],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"Record","label":"Record","definition":"A bounded account of data retained for reference.","definitionSource":"project editorial","children":[],"alternateParents":[],"directParentCount":1,"provisionalParent":null},{"id":"RecreationOrExercise","label":"Recreation Or Exercise","definition":"A &%Process that is carried out for the purpose of recreation or exercise. Since &%RecreationOrExercise is a subclass of &%IntentionalProcess, the intent of a process determines whether or not it is an instance of the class. Hence, if John and Bill watch the same program on television, and John watches it to relax while Bill watches it solely to satisfy an educational requirement, then John's watching the movie is an instance of &%RecreationOrExercise, while Bill's is not (both cases of watching the television program would however be in the class of &%Seeing, since being an instance of this latter class is not determined by intention).","definitionSource":"source KIF","children":["Game"],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"RecursiveFunction","label":"Recursive function","definition":"A function defined from initial functions by recursion and composition.","definitionSource":"project editorial","children":[],"alternateParents":[],"directParentCount":1,"provisionalParent":null},{"id":"Region","label":"Region","definition":"An object defined by spatial extent or boundaries.","definitionSource":"project editorial","children":["AstronomicalBody","GeographicArea","Hole"],"alternateParents":[],"directParentCount":1,"provisionalParent":null},{"id":"RegulatoryProcess","label":"Regulatory Process","definition":"An &%Guiding whose aim is the enforcement of rules or regulations. Note the key differences between &%RegulatoryProcess and the related concept &%Managing. The latter implies a long-term relationship between a single manager and limited number of agents who are managed, while the former implies a normative standard to which the activities of the regulated are referred.","definitionSource":"source KIF","children":[],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"Relation","label":"Relation","definition":"An entity that takes more than one argument.","definitionSource":"project editorial","children":["ClassificationRelation","PartWholeRelation","SpatialRelation","TemporalRelation","CausalRelation","ExplanatoryRelation","ParticipationRelation","SocialRelation","InstitutionalRelation","PerceptualRelation","EpistemicRelation","LogicalRelation","SetTheoreticRelation","MathematicalRelation","TransformationRelation","RepresentationalRelation","IdentityRelation","EquivalenceRelation","ProvenanceRelation"],"alternateParents":[],"directParentCount":1,"provisionalParent":null},{"id":"Relationship","label":"Relationship","definition":"A socially recognized connection between participants.","definitionSource":"project editorial","children":[],"alternateParents":[],"directParentCount":1,"provisionalParent":null},{"id":"ReligiousOrganization","label":"Religious Organization","definition":"An &%Organization whose members share a set of religious beliefs.","definitionSource":"source KIF","children":[],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"ReligiousProcess","label":"Religious Process","definition":"An &%OrganizationalProcess that is carried out within or by a &%ReligiousOrganization.","definitionSource":"source KIF","children":[],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"Remembering","label":"Remembering","definition":"The &%Class of &%PsychologicalProcesses which involve the recollection of prior experiences and/or of knowledge which was previously acquired.","definitionSource":"source KIF","children":[],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"Removing","label":"Removing","definition":"The &%Class of &%Processes where something is taken away from a location. Note that the thing removed and the location are specified with the &%CaseRoles &%patient and &%origin, respectively.","definitionSource":"source KIF","children":["uncover"],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"Repairing","label":"Repairing","definition":"The &%Class of &%Processes where the &%agent makes a modification or series of modifications to an &%Object that is not functioning as intended so that it works properly.","definitionSource":"source KIF","children":["TherapeuticalProcess"],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"Replication","label":"Replication","definition":"The &%Process of biological reproduction. This can be either a sexual or an asexual process.","definitionSource":"source KIF","children":["AsexualReplication","SexualReplication"],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"RepresentationalEntity","label":"Representational entity","definition":"An entity that encodes, expresses, preserves, or transmits content.","definitionSource":"project editorial","children":["Symbol","Name","Label","Notation","Description","Classification","Schema","OntologyRepresentation","Language","Document","Image","Audio","Video","Software","Model"],"alternateParents":[],"directParentCount":1,"provisionalParent":null},{"id":"RepresentationalRelation","label":"Representational relation","definition":"A relation between content and what represents, encodes, or denotes it.","definitionSource":"project editorial","children":[],"alternateParents":[],"directParentCount":1,"provisionalParent":null},{"id":"ReproductiveBody","label":"Reproductive Body","definition":"Reproductive structure of &%Organisms. Consists of an &%Embryonic &%Object and a nutritive/protective envelope. Note that this class includes seeds, spores, and &%FruitOrVegetables, as well as the eggs produced by &%Animals.","definitionSource":"source KIF","children":[],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"Reptile","label":"Reptile","definition":"A &%ColdBloodedVertebrate having an external covering of scales or horny plates. &%Reptiles breathe by means of &%Lungs and generally lay eggs.","definitionSource":"source KIF","children":[],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"request","label":"request","definition":null,"definitionSource":null,"children":[],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"Rodent","label":"Rodent","definition":"The &%Class of &%Mammals with one or two pairs of incisors for gnawing. Includes rats, mice, guinea pigs, and rabbits.","definitionSource":"source KIF","children":[],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"Role","label":"Role","definition":"A socially recognized position with associated expectations.","definitionSource":"project editorial","children":[],"alternateParents":["Property"],"directParentCount":2,"provisionalParent":null},{"id":"Room","label":"Room","definition":"A &%properPart of a &%Building which is separated from the exterior of the &%Building and/or other &%Rooms of the &%Building by walls. Some &%Rooms may have a specific purpose, e.g. sleeping, bathing, cooking, entertainment, etc.","definitionSource":"source KIF","children":[],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"SaltWaterArea","label":"Salt Water Area","definition":"A &%WaterArea whose &%Water is saline, e.g. oceans and seas.","definitionSource":"source KIF","children":[],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"Schema","label":"Schema","definition":"A formal plan for the organization of information.","definitionSource":"project editorial","children":[],"alternateParents":[],"directParentCount":1,"provisionalParent":null},{"id":"School","label":"School","definition":"An institution organized for teaching, learning, or scholarly activity.","definitionSource":"project editorial","children":[],"alternateParents":[],"directParentCount":1,"provisionalParent":null},{"id":"Searching","label":"Searching","definition":"An &%IntentionalProcess which has the purpose for a &%CognitiveAgent to learn the location of a &%Physical.","definitionSource":"source KIF","children":["Investigating","pursue"],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"see","label":"see","definition":null,"definitionSource":null,"children":[],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"select","label":"select","definition":null,"definitionSource":null,"children":[],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"SelfConnectedObject","label":"Self Connected Object","definition":"To be moved — an object whose parts are connected.","definitionSource":"project editorial","children":["ContentBearingObject","CorpuscularObject","Food","Substance"],"alternateParents":[],"directParentCount":1,"provisionalParent":null},{"id":"sell","label":"sell","definition":null,"definitionSource":null,"children":[],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"Senctence","label":"Senctence","definition":null,"definitionSource":null,"children":[],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"SentientAgent","label":"Sentient Agent","definition":"A &%SentientAgent is an &%AutonomousAgent that is capable of &%Perception and experiences some level of consciousness (see &%ConsciousnessAttribute). If the &%AutonomousAgent is able to reason at a comparatively high level (evinced by the ability to learn, plan, and feel emotions), then it is also an instance of &%CognitiveAgent. A &%DomesticAnimal is a &%SentientAgent, but may or may not be a &%CognitiveAgent, depending on the type of &%Animal.","definitionSource":"source KIF","children":["CognitiveAgent"],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"separate","label":"separate","definition":null,"definitionSource":null,"children":["ChemicalDecomposition","dry"],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"Series","label":"Series","definition":"A &%Text consisting of multiple self-contained units. Some examples are an encyclopedia containing a couple dozen volumes, a television series made up of many episodes, a film serial, etc.","definitionSource":"source KIF","children":["Periodical"],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"Set","label":"Set","definition":"A collection treated as one abstract entity.","definitionSource":"project editorial","children":[],"alternateParents":[],"directParentCount":1,"provisionalParent":null},{"id":"SetTheoreticRelation","label":"Set-theoretic relation","definition":"A relation involving sets, membership, inclusion, or ordering.","definitionSource":"project editorial","children":[],"alternateParents":[],"directParentCount":1,"provisionalParent":null},{"id":"SexualReplication","label":"Sexual Replication","definition":null,"definitionSource":null,"children":[],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"ShapeChange","label":"Shape Change","definition":"The &%Process of changing the shape of an &%Object.","definitionSource":"source KIF","children":[],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"shoot","label":"shoot","definition":null,"definitionSource":null,"children":[],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"Signal","label":"Signal","definition":"A perceivable variation that conveys or can convey information.","definitionSource":"project editorial","children":[],"alternateParents":[],"directParentCount":1,"provisionalParent":null},{"id":"smell","label":"smell","definition":null,"definitionSource":null,"children":[],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"SocialEntity","label":"Social entity","definition":"An entity whose persistence depends on participants, recognition, or shared practice.","definitionSource":"project editorial","children":["Person","Group","Community","Relationship","Role","Status","Agreement","Convention","Practice","Event","Institution"],"alternateParents":[],"directParentCount":1,"provisionalParent":null},{"id":"SocialInteraction","label":"Social Interaction","definition":"The &%subclass of &%IntentionalProcess that involves interactions between &%CognitiveAgents.","definitionSource":"source KIF","children":["ChangeOfPossession","Communication","Contest","Cooperation","Meeting","pretend"],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"SocialRelation","label":"Social relation","definition":"A relation constituted by social interaction or recognition.","definitionSource":"project editorial","children":[],"alternateParents":[],"directParentCount":1,"provisionalParent":null},{"id":"Software","label":"Software","definition":"A program or related information used to control computation.","definitionSource":"project editorial","children":[],"alternateParents":[],"directParentCount":1,"provisionalParent":null},{"id":"Solution","label":"Solution","definition":"A liquid mixture. The most abundant component in a solution is called the solvent. Other components are called solutes. A solution, though homogeneous, may nonetheless have variable composition. Any amount of salt, up to a maximum limit, can be dissolved in a given amount of water.","definitionSource":"source KIF","children":[],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"SpatialRelation","label":"Spatial relation","definition":"A relation concerning location, distance, direction, or containment.","definitionSource":"project editorial","children":[],"alternateParents":[],"directParentCount":1,"provisionalParent":null},{"id":"Sport","label":"Sport","definition":"A &%Game which requires some degree of physical exercion from the participants of the game.","definitionSource":"source KIF","children":[],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"State","label":"State","definition":null,"definitionSource":null,"children":[],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"state","label":"state","definition":null,"definitionSource":null,"children":[],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"StateChange","label":"State Change","definition":"Any &%Process where the &%PhysicalState of &%part of the &%patient of the &%Process changes.","definitionSource":"source KIF","children":["Boiling","Condensing","Freezing","Melting"],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"StaticWaterArea","label":"Static Water Area","definition":"A &%WaterArea in which water does not flow constantly or in the same direction, e.g. most lakes and ponds.","definitionSource":"source KIF","children":[],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"StationaryArtifact","label":"Stationary Artifact","definition":"A &%StationaryArtifact is an &%Artifact that has a fixed spatial location. Most instances of this &%Class are architectural works, e.g. the Eiffel Tower, the Great Pyramids, office towers, single_family houses, etc.","definitionSource":"source KIF","children":["Building","Room"],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"Status","label":"Status","definition":"A socially recognized standing or condition.","definitionSource":"project editorial","children":[],"alternateParents":["Property"],"directParentCount":2,"provisionalParent":null},{"id":"Steering","label":"Steering","definition":null,"definitionSource":null,"children":[],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"StreamWaterArea","label":"Stream Water Area","definition":"A relatively narrow ; &%WaterArea where the ;water flows constantly and in the same ; direction, e.g. a river, a stream, ;etc.","definitionSource":"source KIF","children":[],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"SubatomicParticle","label":"Subatomic Particle","definition":"The class of &%ElementalSubstances that are smaller than &%Atoms and compose &%Atoms.","definitionSource":"source KIF","children":["AtomicNucleus","Electron","Neutron","Proton"],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"Substance","label":"Substance","definition":"An &%Object in which every part is similar to every other in every relevant respect. More precisely, something is a &%Substance when it has only arbitrary pieces as parts - any parts have properties which are similar to those of the whole. Note that a &%Substance may nonetheless have physical properties that vary. For example, the temperature, chemical constitution, density, etc. may change from one part to another. An example would be a body of water.","definitionSource":"source KIF","children":["BiologicallyActiveSubstance","Mixture","PureSubstance"],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"substitute","label":"substitute","definition":null,"definitionSource":null,"children":[],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"Summary","label":"Summary","definition":"A short &%Text that is a summary of another, longer &%Text.","definitionSource":"source KIF","children":[],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"SurfaceChange","label":"Surface Change","definition":"&%Processes which involve altering the properties that apply to the surface of an &%Object.","definitionSource":"source KIF","children":["Coloring"],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"Surgery","label":"Surgery","definition":"Any &%TherapeuticProcess that involves making an incision in the &%Animal that is the &%patient of the &%TherapeuticProcess.","definitionSource":"source KIF","children":[],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"swim","label":"swim","definition":null,"definitionSource":null,"children":[],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"Symbol","label":"Symbol","definition":"An entity used to stand for or evoke another entity or meaning.","definitionSource":"project editorial","children":[],"alternateParents":[],"directParentCount":1,"provisionalParent":null},{"id":"SymbolicString","label":"Symbolic String","definition":"The &%Class of alphanumeric sequences.","definitionSource":"source KIF","children":["Character"],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"TactilePerception","label":"Tactile Perception","definition":"The &%subclass of &%Perception in which the sensing is done by &%Touching. Note that &%Touching need not involve &%TactilePerception. For example, a person who has lost all sensation in both of his legs would have no &%TactilePerception of anything his legs were &%Touching.","definitionSource":"source KIF","children":[],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"taste","label":"taste","definition":null,"definitionSource":null,"children":[],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"TemporalRelation","label":"Temporal relation","definition":"A relation concerning time, sequence, or duration.","definitionSource":"project editorial","children":[],"alternateParents":[],"directParentCount":1,"provisionalParent":null},{"id":"terminate_Employment","label":"terminate Employment","definition":null,"definitionSource":null,"children":[],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"Text","label":"Text","definition":"A &%LinguisticExpression or set of &%LinguisticExpressions that perform a specific function related to &%Communication, e.g. express a discourse about a particular topic, and that are inscribed in a &%CorpuscularObject by &%Humans.","definitionSource":"source KIF","children":["Article","Book","Certiﬁcate","MotionPicture","Senctence","Summary"],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"Theorem","label":"Theorem","definition":"A proposition established by an accepted proof.","definitionSource":"project editorial","children":[],"alternateParents":[],"directParentCount":1,"provisionalParent":null},{"id":"TherapeuticalProcess","label":"Therapeutical Process","definition":null,"definitionSource":null,"children":["Surgery"],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"Tissue","label":"Tissue","definition":"An aggregation of similarly specialized &%Cells and the associated intercellular substance. &%Tissues are relatively non-localized in comparison to &%BodyParts, &%Organs or &%Organ components. The main features of &%Tissues are self-connectivity (see &%SelfConnectedObject) and being a homogeneous mass (all parts in the same granularity are instances of &%Tissue as well).","definitionSource":"source KIF","children":["Bone","FatTissue","Muscle"],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"TopologicalEntity","label":"Topological entity","definition":"An entity defined by continuity, neighborhood, or connectedness.","definitionSource":"project editorial","children":[],"alternateParents":[],"directParentCount":1,"provisionalParent":null},{"id":"Touching","label":"Touching","definition":"Any &%Transfer where two &%Objects are brought into immediate physical contact with one another.","definitionSource":"source KIF","children":["impact"],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"ToxicOrganism","label":"Toxic Organism","definition":"The &%Class of &%Organisms which are poisonous to other &%Organisms.","definitionSource":"source KIF","children":[],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"Transaction","label":"Transaction","definition":"The &%subclass of &%ChangeOfPossession where something is exchanged for something else.","definitionSource":"source KIF","children":["FinancialTransaction"],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"Transfer","label":"Transfer","definition":"Any &%instance of &%Translocation where the &%agent and the &%patient are not the same thing.","definitionSource":"source KIF","children":["Impelling","Putting","Touching","Transportation"],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"TransformationRelation","label":"Transformation relation","definition":"A relation connecting an entity to a result of changing it.","definitionSource":"project editorial","children":[],"alternateParents":[],"directParentCount":1,"provisionalParent":null},{"id":"Transportation","label":"Transportation","definition":"&%Motion from one point to another by means of a &%TransportationDevice.","definitionSource":"source KIF","children":[],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"TransportationDevice","label":"Transportation Device","definition":"A &%TransportationDevice is a &%Device which serves as the &%instrument in a &%Transportation &%Process which carries the &%patient of the &%Process from one point to another.","definitionSource":"source KIF","children":[],"alternateParents":[],"directParentCount":0,"provisionalParent":null},{"id":"uncover",
